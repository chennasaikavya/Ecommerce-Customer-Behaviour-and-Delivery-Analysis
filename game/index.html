<script>
const $=s=>document.querySelector(s),MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],GBP=n=>'£'+Math.round(n).toLocaleString('en-GB');
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* ---------- Simulated retail data with the UCI Online Retail schema (seeded: reproducible) ---------- */
const R=rng(42),ri=(a,b)=>a+Math.floor(R()*(b-a+1));let rows=[],n0=10000;
const PN=['MUG','LANTERN','CANDLE','BAG','CUSHION','CARD SET','TEAPOT','FRAME','CLOCK','NOTEBOOK','TRAY','JAR','BUNTING','APRON','TOWEL','BOWL','VASE','HOOK','LIGHTS','BOTTLE','SIGN','BOX','COASTER','RIBBON'],PP=PN.map(()=>+(0.6+R()*6).toFixed(2));
const CT=['United Kingdom','Germany','France','EIRE','Spain'],TY=[{w:.1,f:[12,18],d:[0,340],l:[2,5],q:[4,20]},{w:.25,f:[5,9],d:[0,340],l:[1,3],q:[2,10]},{w:.3,f:[2,5],d:[0,150],l:[1,3],q:[1,8]},{w:.35,f:[1,2],d:[150,340],l:[1,3],q:[1,6]}];
for(let c=0;c<420;c++){let u=R(),t=TY[u<.1?0:u<.35?1:u<.65?2:3],ct=R()<.85?CT[0]:CT[ri(1,4)],nf=ri(...t.f);for(let k=0;k<nf;k++){const inv=''+(++n0),d=ri(...t.d),g=R()<.15,nl=ri(...t.l),s=ri(0,23);for(let i=0;i<nl;i++){const p=(s+i)%24;rows.push({inv,code:'P'+(2000+p),desc:PN[p],q:ri(...t.q),d,p:PP[p],cid:g?null:12000+c,ctry:ct})}}}
const base=rows.slice();base.forEach(x=>{if(x.cid!=null&&R()<.04)rows.push({...x,inv:'C'+x.inv,q:-x.q,d:Math.min(340,x.d+ri(1,10))})});
for(let i=0;i<Math.floor(base.length*.03);i++)rows.push({...base[ri(0,base.length-1)]});
for(let i=0;i<10;i++)rows.push({inv:''+(++n0),code:'P2999',desc:'SAMPLE',q:ri(1,5),d:ri(0,340),p:0,cid:null,ctry:CT[0]});
for(let i=0;i<6;i++)rows.push({inv:'A'+(++n0),code:'P2998',desc:'DAMAGED',q:-ri(1,6),d:ri(0,340),p:PP[1],cid:null,ctry:CT[0]});
[20,70,120,180,240,300].forEach(d=>rows.push({inv:''+(++n0),code:'BULK1',desc:'WHOLESALE CRAFT PAPER',q:3000,d,p:.9,cid:12999,ctry:CT[0]}));
rows.forEach(x=>x.m=new Date(2011,0,1+x.d).getMonth());
const rev=r=>r.reduce((a,x)=>a+x.q*x.p,0),dt=d=>new Date(2011,0,1+d).toISOString().slice(0,10);
const GOOD={miss:'drop',dup:'drop',canc:'split',bad:'drop',out:'keep'};
function clean(c){let r=rows.slice();if(c.dup=='drop'){const s=new Set;r=r.filter(x=>{const k=[x.inv,x.code,x.q,x.d,x.p,x.cid].join('|');if(s.has(k))return 0;s.add(k);return 1})}
if(c.miss=='drop')r=r.filter(x=>x.cid!=null);else if(c.miss=='zero')r=r.map(x=>x.cid==null?{...x,cid:0}:x);
if(c.canc=='split')r=r.filter(x=>x.inv[0]!='C');if(c.bad=='drop')r=r.filter(x=>x.p>0&&(x.q>0||x.inv[0]=='C'));if(c.out=='del')r=r.filter(x=>x.cid!=12999);return r}
/* ---------- ML: k-means (k-means++), silhouette, RFM ---------- */
function km(X,k,seed){const r=rng(seed),n=X.length,d=X[0].length,D=(a,b)=>{let s=0;for(let j=0;j<d;j++)s+=(a[j]-b[j])**2;return s};let C=[X[Math.floor(r()*n)]];while(C.length<k){const w=X.map(x=>Math.min(...C.map(c=>D(x,c))));let t=r()*w.reduce((a,b)=>a+b,0),i=0;while((t-=w[i])>0&&i<n-1)i++;C.push(X[i])}
let L;for(let it=0;it<30;it++){L=X.map(x=>{let b=0,bd=1e18;C.forEach((c,i)=>{const q=D(x,c);if(q<bd){bd=q;b=i}});return b});C=C.map((c,i)=>{const p=X.filter((_,j)=>L[j]==i);return p.length?c.map((_,j)=>p.reduce((a,x)=>a+x[j],0)/p.length):c})}
return{L,I:X.reduce((a,x,i)=>a+D(x,C[L[i]]),0)}}
function sil(X,L,k){if(k<2)return 0;const n=X.length;let tot=0;for(let i=0;i<n;i++){const sm=Array(k).fill(0),cn=Array(k).fill(0);for(let j=0;j<n;j++){if(j==i)continue;let q=0;for(let t=0;t<X[i].length;t++)q+=(X[i][t]-X[j][t])**2;sm[L[j]]+=Math.sqrt(q);cn[L[j]]++}if(!cn[L[i]])continue;const a=sm[L[i]]/cn[L[i]];let b=1e18;for(let c=0;c<k;c++)if(c!=L[i]&&cn[c])b=Math.min(b,sm[c]/cn[c]);tot+=(b-a)/Math.max(a,b)}return tot/n}
function cust(r){const ref=Math.max(...r.map(x=>x.d))+1,m={};r.forEach(x=>{if(x.cid==null)return;const c=m[x.cid]||(m[x.cid]={id:x.cid,last:-1,inv:new Set,M:0});c.last=Math.max(c.last,x.d);if(x.inv[0]!='C')c.inv.add(x.inv);c.M+=x.q*x.p});return Object.values(m).filter(c=>c.M>0&&c.inv.size).map(c=>({id:c.id,R:ref-c.last,F:c.inv.size,M:c.M}))}
let CU=[],CA={};
function fit(k,sc){const key=k+'|'+sc;if(CA[key])return CA[key];const X=CU.map(c=>sc?[Math.log1p(c.R),Math.log1p(c.F),Math.log1p(c.M)]:[c.R,c.F,c.M]);if(sc)for(let j=0;j<3;j++){const m=X.reduce((a,x)=>a+x[j],0)/X.length,s=Math.sqrt(X.reduce((a,x)=>a+(x[j]-m)**2,0)/X.length)||1;X.forEach(x=>x[j]=(x[j]-m)/s)}
let b;for(let s=1;s<=6;s++){const o=km(X,k,s);if(!b||o.I<b.I)b=o}
const g=[...Array(k)].map((_,i)=>{const m=CU.filter((_,j)=>b.L[j]==i),n=m.length||1,S=f=>m.reduce((a,c)=>a+c[f],0);return{o:i,n:m.length,R:S('R')/n,F:S('F')/n,M:S('M')/n,rev:S('M')}}).filter(x=>x.n).sort((a,b)=>a.M-b.M),mp={};g.forEach((x,i)=>mp[x.o]=i);const L=b.L.map(v=>mp[v]),t=g.reduce((a,x)=>a+x.rev,0);g.forEach((x,i)=>{x.id=i+1;x.share=x.rev/t});return CA[key]={k:g.length,L,g,s:sil(X,L,g.length)}}
/* ================= RUNNER GAME ================= */
const S={xp:0,name:'Detective',pt:[],best:{},ch:{}},MZ=46,PAL=['#e74c3c','#f39c12','#2ecc71','#3498db','#9b59b6','#16a085'];let G=null,cv,cx2,W,H,hor,gy,LW,last=0,BG=[];
const sh=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const pear=(a,b)=>{const n=a.length,ma=sum(a,x=>x)/n,mb=sum(b,x=>x)/n;let s=0,sa=0,sb=0;a.forEach((x,i)=>{s+=(x-ma)*(b[i]-mb);sa+=(x-ma)**2;sb+=(b[i]-mb)**2});return s/Math.sqrt(sa*sb)};
const rank=x=>x>=900?'Master Detective':x>=750?'Senior Detective':x>=500?'Junior Detective':'Trainee Detective';
const ov=h=>{const o=$('#ov');o.innerHTML=h?`<div class="card">${h}</div>`:'';o.style.display=h?'flex':'none'};
function hud(){S.xp=sum(Object.values(S.best),x=>x);$('#hud').innerHTML=`<span>👸 ${S.name}</span><span>${G?'❤'.repeat(Math.max(0,G.lives))+'🖤'.repeat(3-Math.max(0,G.lives))+' · '+G.xp+'/'+G.max+' · ⭐'+G.coins:''}</span><span>${S.xp} XP · ${rank(S.xp)}</span>`}
const LV={1:['The Evidence Room','Data types: what each column of the dataset holds.',100],2:['The Data Repair Lab','Missing values, duplicates, cancellations, invalid rows and outliers.',150],3:['The Pattern Hunter','Reading charts, truncated axes, mean vs median, correlation vs causation.',200],4:['The Customer Intelligence Lab','RFM features, scaling, choosing k, reading clusters.',250],5:['The Final Verdict','Evidence-based conclusions, recommendations and limits.',300]};
const mk=c=>{const i=sh(c.o.map((_,j)=>j));c.ok=i.indexOf(c.ok);c.o=i.map(j=>c.o[j]);if(c.vals)c.vals=i.map(j=>c.vals[j]);if(c.cols)c.cols=i.map(j=>c.cols[j]);return c};
function B1(){const sm=f=>rows.slice(0,4).map(f).join(', '),T=[['InvoiceNo',sm(x=>x.inv)+', C'+rows[0].inv,1,'IDs (with a C prefix for cancellations) are labels. You never average an ID: categorical.'],['Quantity',sm(x=>x.q),0,'Item counts can be summed and averaged: numeric.'],['InvoiceDate',sm(x=>dt(x.d)),2,'Dates drive time-series charts like monthly revenue.'],['UnitPrice',sm(x=>x.p),0,'Prices are continuous numbers: numeric.'],['Country',sm(x=>x.ctry),1,'A fixed set of labels: categorical.']];return T.map(([c,s,ok,e])=>mk({q:`What type of data is ${c}?`,ev:[`Rows: ${rows.length.toLocaleString()}  Columns: 8`,c+': '+s],o:['Numeric','Category','Date and time'],ok,xp:20,e}))}
function B2(){const nm=rows.filter(x=>x.cid==null).length,s=new Set,nd=rows.filter(x=>{const k=[x.inv,x.code,x.q,x.d,x.p,x.cid].join('|');if(s.has(k))return 1;s.add(k);return 0}).length,nc=rows.filter(x=>x.inv[0]=='C').length,nb=rows.filter(x=>x.p<=0||(x.q<=0&&x.inv[0]!='C')).length,o=rows.filter(x=>x.cid==12999);
const T=[['miss',`${nm} rows have no CustomerID`,['Segmentation needs to know who bought.'],['Fill with 0','Drop the rows','Keep as is'],['zero','drop','keep'],'Segmentation needs a customer identity. Filling 0 merges every guest into one fake mega-customer.'],['dup',`${nd} rows are exact copies of other rows`,['Same invoice, product, date, price.'],['Remove copies','Keep them'],['drop','keep'],'Duplicates double-count revenue.'],['canc',`${nc} rows are cancellations (invoice starts with C)`,['Quantity is negative.'],['Split into returns','Leave mixed in'],['split','keep'],'Returns are a different event from sales; mixing them blurs revenue and frequency.'],['bad',`${nb} rows have price 0 or a negative quantity`,['Free samples and damaged-stock fixes, not sales.'],['Remove invalid','Keep them'],['drop','keep'],'Invalid rows distort quantity and price statistics.'],['out',`Outlier: customer 12999`,[`${o.length} orders, each 3000 x craft paper at £0.90`,`Spread across the year, total ${GBP(rev(o))}`,'Regular and consistent: a wholesale buyer.'],['Keep and flag','Delete it'],['keep','del'],'Outliers must be investigated, not auto-deleted. This one is real revenue.']];
return T.map(([k,q,ev,o,vals,e])=>mk({q,ev,o,vals,key:k,ok:vals.indexOf(GOOD[k]),xp:30,e}))}
function B3(){const r=S.cl,mv=MN.map((_,m)=>rev(r.filter(x=>x.m==m))),mc=MN.map((_,m)=>new Set(r.filter(x=>x.m==m).map(x=>x.inv)).size),tm=mv.indexOf(Math.max(...mv)),it={};r.forEach(x=>it[x.inv]=(it[x.inv]||0)+x.q*x.p);const iv=Object.values(it).filter(v=>v>0).sort((a,b)=>a-b),mean=sum(iv,x=>x)/iv.length,med=iv[iv.length>>1],cr=pear(mc,mv),mo=[tm,(tm+4)%12,(tm+8)%12];
return[mk({q:'Which month earns the most revenue?',bars:{v:mv,l:MN,z:1},o:mo.map(i=>MN[i]),ok:0,xp:50,e:`${MN[tm]} leads with ${GBP(mv[tm])}. Read it from the evidence, not a guess.`}),
mk({q:'This chart makes Dec look huge. Why is it misleading?',bars:{v:mv,l:MN,z:0},o:['Axis does not start at 0','The data is wrong','Too many bars'],ok:0,xp:50,e:`A truncated axis exaggerates gaps. The real highest/lowest month ratio is ${(Math.max(...mv)/Math.min(...mv)).toFixed(1)}x.`}),
mk({q:'Best statistic for a typical order?',ev:[`Mean ${GBP(mean)}`,`Median ${GBP(med)}`,`Max ${GBP(iv[iv.length-1])}`,'Some orders are 3000-unit wholesale invoices.'],o:['Mean','Median','Max'],ok:1,xp:50,e:`The median (${GBP(med)}) ignores extreme orders; the mean (${GBP(mean)}) is pulled up by them.`}),
mk({q:'Invoices and revenue are correlated. What is justified?',ev:[`Monthly invoices vs revenue: r = ${cr.toFixed(2)}`],o:['More invoices cause sales','Correlation is not cause','No link at all'],ok:1,xp:50,e:'They rise together because customer demand drives both. Correlation alone does not prove cause.'})]}
function sd(f){const m=sum(CU,c=>c[f])/CU.length;return Math.sqrt(sum(CU,c=>(c[f]-m)**2)/CU.length)}
function cl3(m,ok){const o=sh(m.g.map((_,i)=>i).filter(i=>i!=ok)).slice(0,2).concat(ok);return sh(o)}
function B4(){return[()=>{const s=[sd('R'),sd('F'),sd('M')];return mk({q:'Unscaled K-Means: which feature dominates distance?',ev:['Spread (std dev) of raw RFM:',`Recency ${s[0].toFixed(0)} days`,`Frequency ${s[1].toFixed(1)} orders`,`Monetary ${GBP(s[2])}`,`Unscaled silhouette k=3: ${fit(3,false).s.toFixed(2)} (outliers can inflate it)`],o:['Recency','Frequency','Monetary'],ok:s.indexOf(Math.max(...s)),xp:60,e:'K-Means is distance-based, so the widest feature wins. Log plus standardising puts R, F and M on equal footing.'})},
()=>{const ks=[2,3,4,5,6].map(k=>[k,fit(k,true).s]),b=ks.reduce((a,x)=>x[1]>a[1]?x:a),o=sh([b[0],...sh(ks.filter(x=>x[0]!=b[0]).map(x=>x[0])).slice(0,2)]);return mk({q:'Pick the k with the best separated clusters.',ev:['Silhouette (scaled), higher = better:',...o.map(k=>`k=${k}: ${ks.find(x=>x[0]==k)[1].toFixed(3)}`),'Baseline k=1: 0.000 (no structure)'],o:o.map(k=>'k = '+k),ok:o.indexOf(b[0]),xp:70,e:`Silhouette peaks at k=${b[0]}. Metrics guide the choice, but segments must also make business sense.`,on:()=>{S.fin=fit(b[0],true)}})},
()=>{S.fin=S.fin||fit(3,true);const m=S.fin,ok=m.g.reduce((a,x,i)=>x.M>m.g[a].M?i:a,0),c=cl3(m,ok);return mk({q:'Which cluster holds the Champions?',sc:m,ev:m.g.map(x=>`C${x.id}: R ${x.R.toFixed(0)}d  F ${x.F.toFixed(1)}  M ${GBP(x.M)}`),o:c.map(i=>'Cluster '+(i+1)),cols:c.map(i=>PAL[i]),ok:c.indexOf(ok),xp:60,e:'Champions have high spend and frequency with low recency.'})},
()=>{const m=S.fin,ok=m.g.reduce((a,x,i)=>x.R>m.g[a].R?i:a,0),c=cl3(m,ok);return mk({q:'Which cluster is At-risk (quiet the longest)?',sc:m,ev:m.g.map(x=>`C${x.id}: R ${x.R.toFixed(0)}d  F ${x.F.toFixed(1)}  M ${GBP(x.M)}`),o:c.map(i=>'Cluster '+(i+1)),cols:c.map(i=>PAL[i]),ok:c.indexOf(ok),xp:60,e:'At-risk customers have the highest recency: the most days since they last bought.'})}]}
function B5(){return[()=>{const m=S.fin,ok=m.g.reduce((a,x,i)=>x.share>m.g[a].share?i:a,0),c=cl3(m,ok);return mk({q:'Which segment earns the largest revenue share?',sc:m,ev:m.g.map(x=>`C${x.id}: ${x.n} customers, ${(x.share*100).toFixed(0)}% of revenue`),o:c.map(i=>'Cluster '+(i+1)),cols:c.map(i=>PAL[i]),ok:c.indexOf(ok),xp:60,e:'Read the revenue share computed from your own model.'})},
()=>{const m=S.fin,ok=m.g.reduce((a,x,i)=>x.R>m.g[a].R?i:a,0),c=cl3(m,ok);return mk({q:'Which segment needs a win-back effort?',sc:m,ev:m.g.map(x=>`C${x.id}: last order ${x.R.toFixed(0)} days ago`),o:c.map(i=>'Cluster '+(i+1)),cols:c.map(i=>PAL[i]),ok:c.indexOf(ok),xp:60,e:'The longest-quiet customers are the most likely to churn.'})},
()=>mk({q:'Best business recommendation?',ev:['Segments describe behaviour, not causes.'],o:['Reward top + win back at-risk, then test','Discount everyone','Issue more invoices'],ok:0,xp:60,e:'Segment-specific actions use what the clusters show, and a pilot test checks they work.'}),
()=>mk({q:'Which evidence best supports your verdict?',ev:['The director must be able to verify it.'],o:['Charts + table + model output','My opinion','My XP score'],ok:0,xp:60,e:'A verdict needs chart, numbers and model results the director can check.'}),
()=>mk({q:'A genuine limitation of this analysis?',ev:['Think about causes and data coverage.'],o:['One year, no causal test','The model is perfect','No limitations'],ok:0,xp:60,e:'Honest limits (short window, correlation only, k picked by a metric, simulated data here) are part of good Data Science.'})]}

const LESS={
1:[['Numbers vs labels','Numeric columns hold amounts you can add or average. Categorical columns hold names or codes that you use to group things.','Quantity = 6 is numeric. Country = France is a label.'],['IDs look like numbers but are labels','A CustomerID or InvoiceNo is only a name tag. Adding or averaging IDs means nothing, so treat them as categorical.','Average of IDs 12347 and 12350 is 12348.5, a customer that does not exist.'],['Dates are their own type','A real date lets you sort by time and group by month. Text that only looks like a date cannot do that until you convert it.','2011-12-05 gives month = Dec, so you can add up revenue per month.']],
2:[['Missing values','Some rows have empty fields. Decide by purpose: if you need to know who bought, a row with no CustomerID cannot be used.','Filling a blank ID with 0 creates one fake mega-customer. Dropping the row is safer.'],['Duplicates','A duplicate is the same row saved twice. It counts one sale two times and inflates revenue, so remove exact copies.','Same invoice, item, quantity and price twice means one sale, not two.'],['Cancellations and bad rows','Invoices starting with C are returns (negative quantity). A price of 0 or a junk quantity is an error. Separate or remove them.','Quantity -6 on invoice C54321 is a return, not a sale.'],['Outliers','An outlier is a value far from the rest. Check if it is real, then keep it or study it separately.','Typical order is 6 items, but one order has 3000. It drags the average up.']],
3:[['Start bar charts at zero','Bar height shows size. If the axis does not start at 0, small gaps look huge and mislead the reader.','Bars of 90 and 100 look 10 times different if the axis starts at 89.'],['Mean vs median','Mean is the average and is pulled by extreme values. Median is the middle value, so it shows a typical case.','Orders 5, 6, 7, 3000: mean = 754 but median = 6.5.'],['Correlation is not cause','Two things that rise together are correlated, but one may not cause the other. A third factor can drive both.','Invoices and revenue rise together because customer demand drives both.']],
4:[['RFM: three numbers per customer','Recency = days since last order, Frequency = number of orders, Monetary = total spend. Together they describe behaviour.','Last order 5 days ago, 12 orders, £900 spent: R=5, F=12, M=900.'],['K-Means groups by distance','K-Means makes k groups so that members sit close to their group centre. Columns with big numbers dominate the distance.','Spend in pounds (hundreds) beats orders (single digits), so the groups ignore frequency.'],['Scale before clustering','Scaling (often with log) puts all columns on a similar range, so no single column controls the groups.','log of £900 is about 6.8 and log of 12 orders is about 2.5. Now they are comparable.'],['Pick k with silhouette','Silhouette score shows how well separated the groups are. Higher is better. Try several k and pick the best.','If k=3 scores 0.52 and k=5 scores 0.38, choose k=3.']],
5:[['Segments describe behaviour','Clusters show what groups do, not why. Name each one from its R, F and M values.','Low R, high F, high M = Champions. High R and low F = At-risk.'],['Recommend with evidence','A good recommendation names the segment, the action and the proof, then suggests a small test first.','Win-back email to At-risk customers, tested on 10% of them first.'],['State the limits','Say what the analysis cannot show, such as a short time window, correlation only, and how k was chosen.','One year of data cannot show long-term loyalty.']]};
